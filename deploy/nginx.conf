server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;

    # Re-resolve Docker service DNS after a backend recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gatekeeper_backend http://backend_gatekeeper:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Caddy terminates TLS. Preserve its HTTPS metadata across this HTTP hop.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location = /health {
        proxy_pass $gatekeeper_backend$request_uri;
    }

    location ^~ /api/ {
        # Preserve /api/v1/...; errors must never become the SPA index page.
        proxy_pass $gatekeeper_backend$request_uri;
    }

    location = /api {
        return 404;
    }

    # Caddy calls backend_gatekeeper:4000 directly for verification.
    # Retired endpoints and the verification endpoint are not public UI routes.
    location ~ ^/(auth|admin|socket\.io)(/|$) {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
